      .topbar{height:58px;margin:0 -8px;padding:0 12px;background:#fff;border-bottom:1px solid #e4e4e8;display:flex;justify-content:center;align-items:center;position:relative}.brand-lockup{display:flex;justify-content:center;align-items:center}.brand-name{display:none}.brand-logo{display:block!important;width:62px;height:38px;object-fit:contain}.page-heading{padding:13px 0 9px;background:#fff;border-bottom:1px solid #eeeeef}.page-heading h1{color:#222;font-size:17px}.app-shell{background:#fff}.filter-panel{background:#fff}.table-frame{background:#fff}

    <style>
      body{background:#f7f7f9;color:#252525}.app-shell{background:#fff}.topbar{height:44px;border-bottom:0;background:#17194f}.brand-name{font-size:14px;color:#fff;letter-spacing:-.06em}.page-heading{padding:13px 0 9px;border-bottom:1px solid #e3e3e8}.page-heading h1{font-size:17px;color:#202052;letter-spacing:-.06em}.page-heading p{color:#777;font-size:10px}.outline-button{border:0;border-radius:0;color:#202052;padding:5px 0;font-size:10px;background:transparent}.info-icon{border-color:#202052}.filter-panel{border:0;border-bottom:1px solid #dfe0e5;border-radius:0;box-shadow:none;padding:8px 0 7px}.primary-filters{grid-template-columns:minmax(0,.85fr) minmax(0,.85fr) minmax(0,1.2fr) auto;gap:5px}.primary-filters .product-filter{grid-column:auto}.primary-filters select,.select-trigger,.more-filter-button{height:28px;border-color:#cfd0d6;border-radius:3px;font-size:9px}.more-filter-button{padding:0 7px;background:#fff}.secondary-filters{grid-template-columns:repeat(4,minmax(0,1fr)) auto;border-top:1px solid #eeeeef;padding-top:7px;margin-top:7px;gap:4px}.secondary-filters .filter-control select,.secondary-filters .reset-button{height:27px;font-size:9px;border-radius:3px}.table-toolbar{display:flex;flex-direction:row;align-items:flex-end;justify-content:space-between;gap:5px;margin-top:3px;padding:4px 0}.result-count{font-size:9px;color:#777;white-space:nowrap;align-self:flex-end}.result-count strong{font-size:11px;color:#ee2d78}.toolbar-actions{display:flex;align-items:flex-end;gap:4px;min-width:0}.sort-control,.maturity-sort{min-width:0;gap:3px}.sort-control{width:106px}.maturity-sort{width:55px}.sort-control span,.maturity-sort span{font-size:8px;color:#777}.sort-control select,.maturity-sort select{height:27px;border-color:#cfd0d6;border-radius:3px;font-size:9px;padding:0 5px}.primary-button{height:30px;padding:0 9px;border-radius:3px;background:#f2387d;font-size:10px;box-shadow:none;white-space:nowrap}.table-frame{border:0;border-top:1px solid #cfd1da;border-radius:0}.table-frame th{background:#eef2fb;color:#252957;border-color:#d9ddea;font-size:8px}.table-frame td{border-color:#ececf0}.table-meta{padding:5px 0;text-align:right;font-size:8px;color:#999}.status{border-radius:2px;padding:3px 2px;font-size:8px}.table-frame tbody .rate{color:#202052;font-size:12px}.table-frame tbody .rate.gic{font-size:12px!important}.table-frame .gic small{font-size:8px;color:#999}.product-name{font-size:9px}.institution{font-size:8px;color:#444}.grade{font-size:9px}.page-footer{display:none}

      .table-toolbar{padding:3px 0}.result-count{align-self:center}.result-count strong{font-size:10px}.sort-control span,.maturity-sort span{display:none}

    <style>
      .topbar{background:#fff!important;border-bottom:1px solid #e5e5e8!important;height:66px!important;margin:0 -8px!important;padding:0 12px!important}.brand-lockup{width:100%;display:flex;justify-content:center}.kiwoom-wordmark{position:relative;display:inline-block;color:#111850;font-family:Arial,"Noto Sans KR",sans-serif;font-size:25px;font-weight:900;letter-spacing:-.12em;line-height:1}.kiwoom-wordmark i{display:inline-block;width:0;height:0;border-top:17px solid #ed2f7b;border-left:5px solid transparent;border-right:5px solid transparent;transform:rotate(42deg);margin:0 0 5px 4px}.kiwoom-wordmark i:after{content:"";display:block;width:4px;height:15px;background:#ed2f7b;transform:rotate(-42deg) translate(2px,-10px);transform-origin:bottom}.brand-name{display:none!important}
      @media(max-width:430px){.topbar{height:58px!important}.kiwoom-wordmark{font-size:21px}.kiwoom-wordmark i{border-top-width:14px;margin-left:3px}.kiwoom-wordmark i:after{height:12px}}
    </style>
    <style>
      .brand-logo-visible{display:block;width:145px;height:36px;object-fit:contain;object-position:center}.kiwoom-wordmark{display:none}
      @media(max-width:430px){.brand-logo-visible{width:132px;height:32px}}

    <style>
      .brand-logo-visible{width:clamp(210px,66vw,280px);max-width:100%;height:auto;clip-path:inset(0 32% 0 0)}
      .table-frame table{font-family:Arial,"Noto Sans KR",sans-serif;table-layout:fixed}
      .table-frame th,.table-frame td,.table-frame .status,.table-frame .product-name,.table-frame .institution,.table-frame .grade,.table-frame .yn{font-family:inherit;font-size:9px;font-weight:600}

      .table-frame tbody .rate{font-size:12px;font-weight:800}
      .table-frame tbody .rate.gic{font-size:12px!important}

      <link rel="stylesheet" href="rate-export.css" />

      <link rel="stylesheet" href="sales-ranking.css" />
      <link rel="stylesheet" href="design-refresh.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <button id="viewModeButton" class="view-mode-button" type="button" aria-pressed="false">PC버전 보기</button>
        <div class="brand-lockup">
          <img id="brandLogoVisible" class="brand-logo-visible" alt="키움증권" />
          <span class="brand-service">퇴직연금</span>
        </div>
      </header>

      <section class="page-heading">
        <div>
          <h1>2026년 11월 원리금보장상품 금리</h1>
          <p>적용기간 : 2026.11.01 ~ 2026.11.30</p>
        </div>
        <button class="outline-button" id="infoButton" type="button" aria-label="공지사항 열기">
          <span class="info-icon">i</span> 공지사항
        </button>
      </section>

      <section class="filter-panel" aria-label="금리표 조건 필터">
        <div class="filter-heading"><h2>검색 조건</h2><button class="reset-button" id="resetButton" type="button" aria-label="조회 조건 초기화"><span>초기화</span> ↻</button></div>
        <div class="filter-row primary-filters">
          <label class="filter-control">
            <span>기간</span>
            <div class="multi-select" id="periodMultiSelect">
              <button class="select-trigger" id="periodTrigger" type="button" aria-expanded="false">전체 만기 <span>⌄</span></button>
              <div class="multi-menu" id="periodMenu" hidden>
                <label><input type="checkbox" value="0" checked /> 1년</label>
                <label><input type="checkbox" value="1" checked /> 1.5년</label>
                <label><input type="checkbox" value="2" checked /> 3년</label>
                <label><input type="checkbox" value="3" checked /> 5년</label>
              </div>
            </div>
            <select id="periodFilter" hidden>
              <option value="all" selected>전체 만기</option>
            </select>
          </label>
          <label class="filter-control">
            <span>신용등급</span>
            <select id="ratingFilter">
              <option value="all">전체 등급</option>
              <option value="AAA">AAA 이상</option>
              <option value="AA+">AA+ 이상</option>
              <option value="AA">AA 이상</option>
              <option value="AA-">AA- 이상</option>
              <option value="A+">A+ 이상</option>
            </select>
          </label>
          <div class="filter-control product-filter">
            <span>상품군</span>
            <div class="multi-select" id="categoryMultiSelect">
              <button class="select-trigger" id="categoryTrigger" type="button" aria-expanded="false">예금 제외 <span>⌄</span></button>
              <div class="multi-menu" id="categoryMenu" hidden>
                <label><input type="checkbox" value="파생결합사채" checked /> ELB/DLB</label>
                <label><input type="checkbox" value="보험" checked /> GIC</label>
                <label><input type="checkbox" value="은행예금" /> 은행예금</label>
                <label><input type="checkbox" value="저축은행예금" /> 저축은행예금</label>
              </div>
            </div>
          </div>
        </div>
        <div class="filter-summary-row">
          <p class="filter-summary" id="filterSummary" aria-live="polite"></p>
          <button class="view-all-button" id="viewAllButton" type="button" title="라인업·제안가능 조건을 전체로 변경">전체보기</button>
          <button class="more-filter-button" id="moreFilterButton" type="button" aria-expanded="false" aria-controls="secondaryFilters">상세조건 <span>⌄</span></button>
        </div>
        <div class="filter-row secondary-filters" id="secondaryFilters" hidden>
          <label class="filter-control compact"><span>사업자여부</span><select id="pensionFilter"><option value="all">전체</option><option value="Y">Y</option><option value="N">N</option></select></label>
          <label class="filter-control compact"><span>라인업</span><select id="lineupFilter"><option value="Y">Y</option><option value="all">전체</option><option value="N">N</option></select></label>
          <label class="filter-control compact"><span>제안가능여부</span><select id="proposalFilter"><option value="all">전체</option><option value="Y">Y</option><option value="N">N</option><option value="확인">확인필요</option></select></label>
        </div>
      </section>

      <section class="table-toolbar">
        <div class="result-count">조회 결과 <strong id="resultCount">0</strong></div>
        <div class="toolbar-actions"><label class="sort-control"><span>정렬</span><select id="sortFilter"><option value="default">상품군별 기본순</option><option value="rate" selected>만기 금리 높은 순</option><option value="rating">신용등급 높은 순</option></select></label><label class="maturity-sort" id="maturitySortWrap"><span>만기</span><select id="maturitySort"><option value="0">1년</option><option value="1">1.5년</option><option value="2">3년</option><option value="3">5년</option></select></label><button class="primary-button" id="saveButton" type="button">금리표 저장</button></div>
      </section>

      <div class="rate-unit">(연, %)</div>
      <section class="table-frame" aria-label="원리금보장상품 금리표">
        <div class="table-scroll">
          <table class="sales-rate-table">
            <thead><tr>
              <th class="product-col">상품</th><th class="sticky-col institution-col">제공기관</th><th class="grade-col">등급</th><th class="rate-head">1년</th><th class="rate-head">1.5년</th><th class="rate-head">3년</th><th class="rate-head">5년</th><th class="lineup-col">라인업</th><th class="provider-col">사업자</th>
            </tr></thead>
            <tbody id="rateTableBody"></tbody>
          </table>
          <div class="empty-state" id="emptyState" hidden>조건에 맞는 상품이 없습니다.</div>
        </div>
      </section>

      <div class="table-meta">최종 업데이트 2026.11.03 09:20</div>
    </main>

    <div class="modal-backdrop" id="infoModal" hidden>
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="infoTitle">
        <button class="modal-close" data-close="infoModal" aria-label="닫기">×</button>
        <h2 id="infoTitle">공지사항</h2>
        <section id="noticeBanner" class="notice-banner" aria-label="상품담당자 공지" hidden><strong>상품담당자 공지</strong><p id="noticeBannerText"></p></section>
        <div class="guide-list"></div>
      </section>
    </div>

    <div class="modal-backdrop" id="saveModal" hidden>
      <section class="modal save-modal" role="dialog" aria-modal="true" aria-labelledby="saveTitle">
        <button class="modal-close" data-close="saveModal" aria-label="닫기">×</button><div class="eyebrow">EXPORT</div><h2 id="saveTitle">금리표 저장 범위</h2><p class="modal-lead">저장할 범위를 선택하면 문서형 미리보기로 이어집니다.</p>
        <div class="save-options"><button class="save-option selected" data-save-scope="current"><span class="radio-dot"></span><span><b>현재 조회 결과</b><small>현재 필터와 정렬을 반영해 저장</small></span><em>추천</em></button><button class="save-option" data-save-scope="all"><span class="radio-dot"></span><span><b>전체 금리표</b><small>필터와 무관한 전체 대상 상품 저장</small></span></button></div>
        <p id="saveMessage" role="status"></p>
        <div class="modal-actions"><button class="text-button" data-close="saveModal">취소</button><button class="primary-button" id="previewButton" type="button">미리보기 열기 <span>→</span></button></div>
      </section>
    </div>

    <div class="modal-backdrop" id="exportModal" hidden>
      <section class="rate-export-dialog" role="dialog" aria-modal="true" aria-labelledby="exportTitle">
        <header class="rate-export-header"><div><h2 id="exportTitle">금리표 저장 미리보기</h2><p id="exportSummary"></p></div><button type="button" id="exportClose" aria-label="미리보기 닫기">×</button></header>
        <div class="rate-export-tools"><button type="button" id="exportBack">← 저장 범위</button><button type="button" id="exportFit" aria-pressed="true">전체 폭</button><button type="button" id="exportActual" aria-pressed="false">확대 보기</button></div>
        <div id="exportStage"><img id="exportImage" hidden alt="금리표 미리보기" /></div>
        <footer class="rate-export-footer"><p id="exportMessage" role="status" aria-live="polite"></p><div class="rate-export-actions"><a id="exportOpenImage" target="_blank" rel="noopener" hidden>이미지 열기</a><button id="exportShare" type="button" hidden>공유·기기에 저장</button><button id="exportDownload" type="button" disabled>PNG 저장</button></div></footer>
      </section>
    </div>

    <script src="rates-data.js"></script>
    <script src="rate-upload-core.js"></script>
    <script src="rate-model.js"></script>
    <script src="app.js"></script>
    <script src="basic-settings-data.js"></script>
    <script src="pension-providers-data.js"></script>
    <script src="management.js"></script>
    <script src="notice-publish.js"></script>
    <script src="notice-ui.js"></script>
    <script src="rate-xlsx.js"></script>
    <script src="rate-upload-ui.js"></script>
    <script src="sales-ranking.js"></script>
    <script src="rate-export.js"></script>
    <script src="rate-export-ui.js"></script>
    <script src="rate-scroll.js"></script>
  </body>
</html>
