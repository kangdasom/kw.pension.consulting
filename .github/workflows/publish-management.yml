name: Publish monthly management

on:
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: publish-monthly-management
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor == 'kangdasom' && github.event.sender.id == 311216178 && github.event.issue.user.id == 311216178 && github.event.issue.title == '월별 한도관리 저장 요청'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs'), vm = require('node:vm');
            const api = require('./management-publish.js');
            const args = {owner: context.repo.owner, repo: context.repo.repo};
            const {data: file} = await github.rest.repos.getContent({...args, path: api.path, ref: 'main'});
            const current = JSON.parse(Buffer.from(file.content, 'base64').toString('utf8'));
            const catalog = {window: {}};
            vm.runInNewContext(fs.readFileSync('rates-data.js', 'utf8'), catalog, {timeout: 1000});
            const next = api.parseIssue(context.payload, current, catalog.window.RATE_IMPORT.products);
            let sourceSha;
            if (next.revision !== current.revision) {
              const {data: saved} = await github.rest.repos.createOrUpdateFileContents({
                ...args, path: api.path, branch: 'main', sha: file.sha,
                message: 'Publish monthly management (' + JSON.parse(context.payload.issue.body).month + ')',
                content: Buffer.from(JSON.stringify(next, null, 2) + '\n').toString('base64')
              });
              sourceSha = saved.commit.sha;
            } else {
              const {data: head} = await github.rest.repos.getCommit({...args, ref: 'main'});
              sourceSha = head.sha;
            }
            if (!/^[0-9a-f]{40}$/.test(sourceSha)) throw Error('저장한 배포 버전을 확인하지 못했습니다.');
            await github.rest.actions.createWorkflowDispatch({...args, workflow_id: 'deploy-pages.yml', ref: 'main', inputs: {source_sha: sourceSha}});
            await github.rest.issues.update({...args, issue_number: context.issue.number, state: 'closed', state_reason: 'completed'});
