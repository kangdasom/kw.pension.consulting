name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify existing behavior
        run: |
          node scripts/check-rates.cjs
          node scripts/check-management.cjs
          node scripts/check-rate-scroll.cjs
          node scripts/check-rate-export.cjs
          node scripts/check-rate-export-ui.cjs
          node scripts/check-rate-upload.cjs
          node scripts/check-notice-publish.cjs
      - name: Prepare static files and check paths
        run: node scripts/prepare-pages.cjs --audit-tracked
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .pages-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
